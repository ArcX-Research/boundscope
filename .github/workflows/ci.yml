name: Verify Boundscope

on:
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Clang and sanitizer runtimes
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-rt-dev
      - name: Record toolchains
        run: |
          uname -a
          rustc --version
          /usr/bin/clang --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/python/test_interfaces.py
      - run: python -m pip install -r tests/python/requirements.txt
      - run: python tests/python/test_mcp_client.py
      - run: cargo build --locked --release
